<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Card Interest Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body class="bg-light">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Initial Balance (₹)</label>
            <input type="number" step="0.01" name="initial_balance" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Annual Interest Rate (%)</label>
            <input type="number" step="0.01" name="interest_rate" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Minimum Monthly Payment (₹)</label>
            <input type="number" step="0.01" name="min_payment" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Number of Months</label>
            <input type="number" name="months" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Calculate Balance</button>
    </form>
    {% if error_message %}
    <div class="alert alert-danger mt-3">{{ error_message }}</div>
    {% endif %}
    {% if balance is not None %}
        <div class="alert alert-success mt-4 text-center">
            <strong>Remaining Balance:</strong> ₹{{ balance }}
        </div>
    {% elif error_message %}
        <div class="alert alert-danger mt-4 text-center">
            {{ error_message }}
        </div>
    {% endif %}
    <a href="{% url 'dashboard' %}" class="text-decoration-none">Back to Dashboard</a>

</body>
</html>
