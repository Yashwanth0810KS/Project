<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
        <h2 class="text-center mb-4">Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid">
                <button type="submit" class="btn btn-primary" style="background-color: #003366; color: white;">Login</button>
            </div>
        </form>
        <p class="mt-3 text-center">
            Don't have an account? <a href="{% url 'register' %}">Register</a>
        </p>


</body>
</html>
