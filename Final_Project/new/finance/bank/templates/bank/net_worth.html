<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Net Worth Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body class="bg-light">


<h4>Net Worth Calculator</h4>
<p class="mb-0 small">Calculates net worth based on your assets and liabilities</p>

<div class="card-body">
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label>Total Assets (₹)</label>
        <input type="number" name="assets" class="form-control" min="0" required>
    </div>
    <div class="mb-3">
        <label>Total Liabilities (₹)</label>
        <input type="number" name="liabilities" class="form-control" min="0" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Calculate Net Worth</button>
</form>


{% if error_message %}
    <div class="alert alert-danger mt-3 text-center">
        {{ error_message }}
    </div>
{% endif %}


{% if net_worth is not None %}
    <div class="alert alert-success mt-4 text-center">
        <strong>Your Net Worth:</strong> ₹{{ net_worth }}
    </div>
{% endif %}
</div>


<a href="{% url 'dashboard' %}" class="text-decoration-none">Back to Dashboard</a>

</body>
</html>
